<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag & Drop Gallery</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>DRAG AND DROP GALLERY</h1>

    <div class="gallery">
      <div class="image-list">
        <img
          class="small-image"
          src="images/image1.jpg"
          draggable="true"
          alt="Image 1"
        />

        <img
          class="small-image"
          src="images/image2.jpg"
          draggable="true"
          alt="Image 2"
        />

        <img
          class="small-image"
          src="images/image3.jpg"
          draggable="true"
          alt="Image 3"
        />

        <img
          class="small-image"
          src="images/image4.jpg"
          draggable="true"
          alt="Image 4"
        />

        <img
          class="small-image"
          src="images/image5.jpg"
          draggable="true"
          alt="Image 5"
        />
      </div>

      <div class="display-box">
        <img id="display-image" src="" alt="Selected image" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
